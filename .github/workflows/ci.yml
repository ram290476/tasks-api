name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tasks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/tasks_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate a throwaway JWT secret
        run: echo "JWT_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: tasks-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image against Postgres
        run: |
          DB_PASSWORD=$(openssl rand -hex 24)
          JWT_SECRET=$(openssl rand -base64 48)
          docker network create ci
          docker run -d --name db --network ci \
            -e POSTGRES_USER=tasks -e POSTGRES_PASSWORD="$DB_PASSWORD" -e POSTGRES_DB=tasks \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec db pg_isready -U tasks && break; sleep 2
          done
          docker run -d --name api --network ci -p 3000:3000 \
            -e DATABASE_URL="postgres://tasks:${DB_PASSWORD}@db:5432/tasks" \
            -e JWT_SECRET="$JWT_SECRET" \
            tasks-api:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/health && exit 0; sleep 2
          done
          docker logs api
          exit 1
